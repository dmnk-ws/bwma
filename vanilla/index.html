<!DOCTYPE html>

<html lang="en">
    <head>
        <title>bwma</title>
        <style>
            .box {
                width: 300px;
                padding: 10px;
                margin: 0 auto;
            }

            section {
                margin-bottom: 10px;
            }

            .text {
                color: white;
                text-align: center;
            }

            .inline {
                display: inline-block;
            }

            .flex {
                display: flex;
            }

            .blue {
                background-color: blue;
            }

            .red {
                background-color: red;
            }

            .green {
                background-color: green;
            }

            .box2 {
                height: 100px;
                width: 50%;
            }
        </style>
    </head>
    <body>
        <section>
            <div class="blue box">
                <p class="text">Hello World</p>
            </div>
        </section>
        <section>
            <div class="inline blue box2"></div><div class="inline red box2"></div>
        </section>
        <section class="flex">
            <div class="green box2"></div>
            <div class="green box2"></div>
        </section>
    </body>
</html>
