<!DOCTYPE html>

<html lang="en">
    <head>
        <title>bwma</title>
        <style>
            .box {
                width: 300px;
                background-color: blue;
                padding: 10px;
                margin: 0 auto;
            }

            section {
                margin-bottom: 10px;
            }

            .text {
                color: white;
                text-align: center;
            }

            .inline {
                display: inline-block;
                height: 100px;
                width: 50%;
            }

            .left-box {
                background-color: blue;
            }

            .right-box {
                background-color: red;
            }
        </style>
    </head>
    <body>
        <section>
            <div class="box">
                <p class="text">Hello World</p>
            </div>
        </section>
        <section>
            <div class="inline left-box"></div><div class="inline right-box"></div>
        </section>
    </body>
</html>
