<main class="container">
  <h1>Counter</h1>
  <div class="card">
    <p>Count: {{counter()}}</p>
    <p>Is even number: {{isEven()}}</p>

    <div class="flex">
      <button matButton="elevated" (click)="increment()">Increment</button>
      <button matButton="elevated" (click)="decrement()">Decrement</button>
    </div>
  </div>
</main>
