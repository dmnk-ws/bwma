<main class="container">
  <h1>Edit {{user?.firstname + " " + user?.lastname}}</h1>

  @if (user) {
    <h2>User Form</h2>
    <div class="card">
      <form>
        <div>
          <label for="firstname">Firstname</label>
          <input id="firstname" name="firstname" type="text" [(ngModel)]="user.firstname" />
        </div>
        <div>
          <label for="lastname">Lastname</label>
          <input id="lastname" name="lastname" type="text" [(ngModel)]="user.lastname" />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="text" [(ngModel)]="user.phone" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" [(ngModel)]="user.email" />
        </div>
      </form>
    </div>
  }

  <h2 id="name">User Detail</h2>
  <div class="card">
    <dl class="user-details">
      <dt>Username</dt>
      <dd>{{user?.username ?? '-'}}</dd>
      <dt>Firstname</dt>
      <dd>{{user?.firstname ?? '-'}}</dd>
      <dt>Lastname</dt>
      <dd>{{user?.lastname ?? '-'}}</dd>
      <dt>Phone</dt>
      <dd>{{user?.phone ?? '-'}}</dd>
      <dt>Email</dt>
      <dd>{{user?.email ?? '-'}}</dd>
      <dt>Address</dt>
      <dd>{{parseAddress(user?.address)}}</dd>
    </dl>
  </div>
</main>
