<!DOCTYPE html>

<html lang="en">
    <head>
        <title>bwma</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .box {
                width: 300px;
                padding: 10px;
                margin: 0 auto;
            }

            section {
                margin-bottom: 10px;
            }

            .text {
                color: white;
                text-align: center;
            }

            .inline {
                font-size: 0;
            }

            .inline-block {
                display: inline-block;
            }

            .flex {
                display: flex;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .blue {
                background-color: blue;
            }

            .red {
                background-color: red;
            }

            .green {
                background-color: green;
            }

            .box2 {
                height: 100px;
                width: 50%;
            }

            .box3 {
                height: 100px;
                width: 100%;
            }

            @media screen and (min-width: 641px) {
                .grid {
                    grid-template-columns: repeat(3, 1fr);
                }
            }

            @media screen and (min-width:1281px) {
                .grid {
                    grid-template-columns: repeat(4, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <section>
            <div class="blue box">
                <p class="text">Hello World</p>
            </div>
        </section>
        <section class="inline">
            <div class="inline-block blue box2"></div>
            <div class="inline-block red box2"></div>
        </section>
        <section class="flex">
            <div class="green box2"></div>
            <div class="green box2"></div>
        </section>
        <section class="grid">
            <div class="blue box3"></div>
            <div class="red box3"></div>
            <div class="green box3"></div>
            <div class="blue box3"></div>
            <div class="red box3"></div>
            <div class="green box3"></div>
            <div class="blue box3"></div>
            <div class="red box3"></div>
            <div class="green box3"></div>
            <div class="blue box3"></div>
            <div class="red box3"></div>
            <div class="green box3"></div>
        </section>
    </body>
</html>
